front:
  text: 原人論序終南山草堂寺沙門宗密述萬靈蠢蠢皆有其本萬物藝藝各歸其根未有無根本而有枝末者也況三才中之最靈而無本源乎且知人者智自知者明今我稟得人身而不自知所從來曷能知他世所趣乎曷能知天下古今之人事乎故數十年中學無常師博考內外以原自身原之不已果得其本然今習儒道者秖知近則乃祖乃父傳體相續受得此身遠則混沌一氣剖為陰陽之二二生天地人三三生萬物萬物與人皆氣為本習佛法者但云近則前生造業隨業受報得此人身遠則業又從惑展轉乃至阿賴耶識為身根本皆謂已窮而實未也然孔老釋迦皆是至聖隨時應物設教殊塗內外相資共利群庶策勤萬行明因果始終推究萬法彰生起本末雖皆聖意而有實有權二教唯權佛兼權實策萬行懲惡勸善同歸於治則三教皆可遵行推萬法窮理盡性至於本源則佛教方為決了然當今學士各執一宗就師佛者仍迷實義故於天地人物不能原之至源余今還依內外教理推窮萬法初從淺至深於習權教者斥滯令通而極其本後依了教顯示展轉生起之義會偏令圓而至於末末即天地人物文有四篇名原人也原人論序終
