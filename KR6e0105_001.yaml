body:
  text: 終南山草堂寺沙門宗密述斥迷執第一習儒道者儒道二教說人畜等類皆是虛無大道生成養育謂道法自然生於元氣元氣生天地天地生萬物故愚智貴賤貧富苦樂皆稟於天由於時命故死後却歸天地復其虛無然外教宗旨但在乎依身立行不在究竟身之元由所說萬物不論象外雖指大道為本而不備明順逆起滅染淨因緣故習者不知是權執之為了今略舉而詰之所言萬物皆從虛無大道而生者大道即是生死賢愚之本吉凶禍福之基基本既其常存則禍亂凶愚不可除也福慶賢善不可益也何用老莊之教耶又道育虎狼胎桀紂夭顏冉禍夷齊何名尊乎又言萬物皆是自然生化非因緣者則一切無因緣處悉應生化謂石應生草草或生人人生畜等又應生無前後起無早晚神仙不藉丹藥太平不藉賢良仁義不藉教習老莊周孔何用立教為軌則乎又言皆從元氣而生成者則歘生之神未曾習慮豈得嬰孩便能愛惡驕恣焉若言歘有自然便能隨念愛惡等者則五德六藝悉能隨念而解何待因緣學習而成又若生是稟氣而歘有死是氣散而歘無則誰為鬼神乎且世有鑒達前生追憶往事則知生前相續非稟氣而歘有又驗鬼神靈知不斷則知死後非氣散而歘無故祭祀求禱典藉有文況死而蘇者說幽途事或死後感動妻子讎報怨恩今古皆有耶外難曰若人死為鬼則古來之鬼填塞巷路合有見者如何不爾答曰人死六道不必皆為鬼鬼死復為人等豈古來積鬼常存耶且天地之氣本無知也人稟無知之氣安得歘起而有知乎草木亦皆稟氣何不知乎又言貧富貴賤賢愚善惡吉凶禍福皆由天命者則天之賦命奚有貧多富少賤多貴少乃至禍多福少苟多少之分在天天何不平乎況有無行而貴守行而賤無德而富有德而貧逆吉義凶仁夭暴壽乃至有道者喪無道者興既皆由天天乃興不道而喪道何有福善益謙之賞禍淫害盈之罰焉又既禍亂反逆皆由天命則聖人設教責人不責天罪物不罪命是不當也然則詩刺亂政書讚王道禮稱安上樂號移風豈是奉上天之意順造化之心乎是知專此教者未能原人斥偏淺第二習佛不了義教者佛教自淺之深略有五等一人天教二小乘教三大乘法相教四大乘破相教上四在此篇中五一乘顯性教此一在第三篇中一佛為初心人且說三世業報善惡因果謂造上品十惡死墮地獄中品餓鬼下品畜生故佛且類世五常之教天竺世教儀式雖殊懲惡勸善無別亦不離仁義等五常而有德行可修例如此國斂手而舉吐番散手而垂皆為禮也令持五戒不殺是仁不盜是義不邪淫是禮不妄語是信不飲噉酒肉神氣清潔益於智也得免三途生人道中修上品十善及施戒等生六欲天修四禪八定生色界無色界天題中不標天鬼地獄者界地不同見聞不及凡俗尚不知末況肯窮本故對俗教且標原人今敘佛經理宜具列故名人天教也然業有三種一惡二善三不動報有三時謂現報生報後報據此教中業為身本今詰之曰既由造業受五道身未審誰人造業誰人受報若此眼耳手足能造業者初死之人眼耳手足宛然何不見聞造作若言心作何者是心若言肉心肉心有質繫於身內如何速入眼耳辨外是非是非不知因何取捨且心與眼耳手足俱為質閡豈得內外相通運動應接同造業緣若言但是喜怒愛惡發動身口令造業者喜怒等情乍起乍滅自無其體將何為主而作業耶設言不應如此別別推尋都是我此身心能造業者此身已死誰受苦樂之報若言死後更有身者豈有今日身心造罪修福令他後世身心受苦受樂據此則修福者屈甚造罪者幸甚如何神理如此無道故知但習此教者雖信業緣不達身本二小乘教者說形骸之色思慮之心從無始來因緣力故念念生滅相續無窮如水涓涓如燈焰焰身心假合似一似常凡愚不覺執之為我寶此我故即起貪貪名利以榮我瞋瞋違情境恐侵害我癡非理計校等三毒三毒擊意發動身口造一切業業成難逃故受五道苦樂等身別業所感三界勝劣等處共業所感於所受身還執為我還起貪等造業受報身則生老病死死而復生界則成住壞空空而復成從空劫初成世界者頌曰空界大風起傍廣數無量厚十六洛叉金剛不能壞此名持界風光音金藏雲布及三千界雨如車軸下風遏不聽流深十一洛叉始作金剛界次第金藏雲注雨滿其內先成梵王界乃至夜摩天風鼓清水成須彌七金等滓濁為山地四洲及泥犁鹹海外輪圍方名器界立時經一增減乃至二禪福盡下生人間初食地餅林藤後粳米不銷大小便利男女形別分田立主求臣佐種種差別經十九增減兼前總二十增減名為成劫議曰空界劫中是道教指云虛無之道然道體寂照靈通不是虛無老氏或迷之或權設務絶人欲故指空界為道空界中大風即彼混沌一氣故彼云道生一也金藏雲者氣形之始即太極也雨下不流陰氣凝也陰陽相合方能生成矣梵王界乃至須彌者彼之天也滓濁者地即一生二矣二禪福盡下生即人也即二生三三才備矣地餅已下乃至種種即三生萬物此當三皇已前穴居野食未有火化等但以其時無文字記載故後人傳聞不明展轉錯謬諸家著作種種異說佛教又緣通明三千世界不局大唐故內外教文不全同也住者住劫亦經二十增減壞者壞劫亦二十增減前十九增減壞有情後一增減壞器界能壞是火水風等三災空者空劫亦二十增減中空無世界及諸有情也劫劫生生輪回不絶無終無始如汲井輪道教只知今此世界未成時一度空劫云虛無混沌一氣等名為元始不知空界已前早經千千萬萬遍成住壞空終而復始故知佛教法中小乘淺淺之教已超外典深深之說都由不了此身本不是我不是我者謂此身本因色心和合為相今推尋分析色有地水火風之四大心有受能領納好惡之事想能取像者行能造作者念念遷流識能了別者之四蘊若皆是我即成八我況地大中復有衆多謂三百六十段骨一一各別皮毛筋肉肝心脾腎各不相是諸心數等亦各不同見不是聞喜不是怒展轉乃至八萬四千塵勞既有此衆多之物不知定取何者為我若皆是我我即百千一身之中多主紛亂離此之外復無別法翻覆推我皆不可得便悟此身但是衆緣似和合相元無我人為誰貪瞋為誰殺盜施戒知苦諦也遂不滯心於三界有漏善惡斷集諦也但修無我觀智道諦以斷貪等止息諸業證得我空真如滅諦乃至得阿羅漢果灰身滅智方斷諸苦據此宗中以色心二法及貪瞋癡為根身器界之本也過去未來更無別法為本今詰之曰夫經生纍世為身本者自體須無間斷今五識闕緣不起根境等為緣意識有時不行悶絶睡眠滅盡定無想定無想天無色界天無此四大如何持得此身世世不絶是知專此教者亦未原身三大乘法相教者說一切有情無始已來法爾有八種識於中第八阿賴耶識是其根本頓變根身器界種子轉生七識皆能變現自分所緣都無實法如何變耶謂我法分別熏習力故諸識生時變似我法第六七識無明覆故緣此執為實我實法如患重病心惛見異色人物也夢夢想所見可知者患夢力故心似種種外境相現夢時執為實有外物寤來方知唯夢所變我身亦爾唯識所變迷故執有我及諸境由此起惑造業生死無窮廣如前說悟解此理方知我身唯識所變識為身本不了之義如後所破四大乘破相教者破前大小乘法相之執密顯後真性空寂之理破相之談不唯諸部般若遍在大乘經前之三教依次先後此教隨執即破無定時節故龍樹立二種般若一共二不共共者二乘同聞信解破二乘法執故不共者唯菩薩解密顯佛性故故天竺戒賢智光二論師各立三時教指此空教或云在唯識法相之前或云在後今意取後將欲破之先詰之曰所變之境既妄能變之識豈真若言一有一無者此下却將彼喻破之則夢想與所見物應異異則夢不是物物不是夢寤來夢滅其物應在又物若非夢應是真物夢若非物以何為相故知夢時則夢想夢物似能見所見之殊據理則同一虛妄都無所有諸識亦爾以皆假託衆緣無自性故故中觀論云未曾有一法不從因緣生是故一切法無不是空者又云因緣所生法我說即是空起信論云一切諸法唯依妄念而有差別若離心念即無一切境界之相經云凡所有相皆是虛妄離一切相即名諸佛如此等文遍大乘藏是知心境皆空方是大乘實理若約此原身身元是空空即是本今復詰此教曰若心境皆無知無者誰又若都無實法依何現諸虛妄且現見世間虛妄之物未有不依實法而能起者如無濕性不變之水何有虛妄假相之波若無淨明不變之鏡何有種種虛假之影又前說夢想夢境同虛妄者誠如所言然此虛妄之夢必依睡眠之人今既心境皆空未審依何妄現故知此教但破執情亦未明顯真靈之性故法鼓經云一切空經是有餘說有餘者餘義未了也大品經云空是大乘之初門上之四教展轉相望前淺後深若且習之自知未了名之為淺若執為了即名為偏故就習人云偏淺也直顯真源第三佛了義實教五一乘顯性教者說一切有情皆有本覺真心無始以來常住清淨昭昭不昧了了常知亦名佛性亦名如來藏從無始際妄相翳之不自覺知但認凡質故耽著結業受生死苦大覺愍之說一切皆空又開示靈覺真心清淨全同諸佛故華嚴經云佛子無一衆生而不具有如來智慧但以妄想執著而不證得若離妄想一切智自然智無礙智即得現前便舉一塵含大千經卷之喻塵況衆生經況佛智次後又云爾時如來普觀法界一切衆生而作是言奇哉奇哉此諸衆生云何具有如來智慧迷惑不見我當教以聖道令其永離妄想自於身中得見如來廣大智慧與佛無異評曰我等多劫未遇真宗不解返自原身但執虛妄之相甘認凡下或畜或人今約至教原之方覺本來是佛故須行依佛行心契佛心返本還源斷除凡習損之又損以至無為自然應用恆沙名之曰佛當知迷悟同一真心大哉妙門原人至此然佛說前五教或漸或頓若有中下之機則從淺至深漸漸誘接先說初教令離惡住善次說二三令離染住淨後說四五破相顯性會權歸實依實教修乃至成佛若上上根智則從本至末謂初便依第五頓指一真心體心體既顯自覺一切皆是虛妄本來空寂但以迷故託真而起須以悟真之智斷惡修善修善息妄歸真妄盡真圓是名法身佛會通本末第四會前所斥同歸一源皆為正義真性雖為身本生起蓋有因由不可無端忽成身相但緣前宗未了所以節節斥之今將本末會通乃至儒道亦是初唯第五性教所說從後段已去節級方同諸教各如注說謂初唯一真靈性不生不滅不增不減不變不易衆生無始迷睡不自覺知由隱覆故名如來藏依如來藏故有生滅心相自此方是第四教亦同破此已生滅諸相所謂不生滅真心與生滅妄想和合非一非異名為阿賴耶識此識有覺不覺二義此下方是第三法相教中亦同所說依不覺故最初動念名為業相又不覺此念本無故轉成能見之識及所見境界相現又不覺此境從自心妄現執為定有名為法執此下方是第二小乘教中亦同所說執此等故遂見自他之殊便成我執執我相故貪愛順情諸境欲以潤我瞋嫌違情諸境恐相損惱愚癡之情展轉增長此下方是第一人天教中亦同所說故殺盜等心神乘此惡業生於地獄鬼畜等中復有怖此苦者或性善者行施戒等心神乘此善業運於中陰入母胎中此下方是儒道二教亦同所說稟氣受質會彼所說以氣為本氣則頓具四大漸成諸根心則頓具四蘊漸成諸識十月滿足生來名人即我等今者身心是也故知身心各有其本二類和合方成一人天修羅等大同於此然雖因引業受得此身復由滿業故貴賤貧富壽夭病健盛衰苦樂謂前生敬慢為因今感貴賤之果乃至仁壽殺夭施富慳貧種種別報不可具述是以此身或有無惡自禍無善自福不仁而壽不殺而夭等者皆是前生滿業已定故今世不同所作自然如然外學者不知前世但據目覩唯執自然會彼所說自然為本復有前生少者修善老而造惡或少惡老善故今世少小富貴而樂老大貧賤而苦或少貧苦老富貴等故外學者不知唯執否泰由於時運會彼所說皆由天命然所稟之氣展轉推本即混一之元氣也所起之心展轉窮源即真一之靈心也究實言之心外的無別法元氣亦從心之所變屬前轉識所現之境是阿賴耶相分所攝從初一念業相分為心境之二心既從細至麁展轉妄計乃至造業如前敘列境亦從微至著展轉變起乃至天地即彼始自太易五重運轉乃至太極太極生兩儀彼說自然大道如此說真性其實但是一念能變見分彼云元氣如此一念初動其實但是境界之相業既成熟即從父母稟受二氣與業識和合成就人身據此則心識所變之境乃成二分一分即與心識和合成人一分不與心識和合即成天地山河國邑三才中唯人靈者由與心神合也佛說內四大與外四大不同正是此也哀哉寡學異執紛然寄語道流欲成佛者必須洞明麁細本末方能棄末歸本返照心源麁盡細除靈性顯現無法不達名法報身應現無窮名化身佛
